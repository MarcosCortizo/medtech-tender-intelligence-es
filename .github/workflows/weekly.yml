name: weekly pipeline

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ODBC Driver 18
        run: |
          if ! odbcinst -q -d | grep -q "ODBC Driver 18"; then
            curl -sSL -O https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb
            sudo dpkg -i packages-microsoft-prod.deb
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          fi

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          SQL_SERVER: ${{ secrets.SQL_SERVER }}
          SQL_DB: ${{ secrets.SQL_DB }}
          SQL_USER: ${{ secrets.SQL_USER }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: python src/run_pipeline.py